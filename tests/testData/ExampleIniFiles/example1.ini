# First line of comment (Unix style)
; Second line of comment (regular ini file comment style)

[DEFAULT]
version = 1.2
prefixmap = res:./Indicies;./resourcesOnBranch res2:./ResourceGroups

#=============================================================================
# example1.ini - test file
# - This file is intended to test generic ini file parsing.
# - Ini file parser of this file should handle both regular ini comments (;) and Unix style (#) comments.
; - It should handle multi-line values too (as in the respaths values below).
;=============================================================================

[testYamlFilesOverMultiLineResPaths]
filter      =   [ .yaml ]
respaths    =   res:/...
                res2:/...
resfile     =   res:/binaryFileIndex_v0_0_0.txt

