[DEFAULT]
prefixmap = resRoot:. resPatch:PatchWithInputChunk resLocalCDN:PatchWithInputChunk/LocalCDNPatches resPrevious:PatchWithInputChunk/PreviousBuildResources

#=============================================================================
# validComplexExample1.ini - test file
# - The prefixmap contains four entries:
#   * resRoot:     => The testData (root) folder, in order to have access to resourceOnBranch folder
#   * resPatch:    => A folder containing 3 sub folders and both .yaml and .txt files in its root
#   * resLocalCDN: => A subfolder that we can use to create different relative patsh to same actual path from either resRoot or resPatch
#   * resPrevious: => A subfolder to be used to create different priority levels for same actual path from either resRoot or resPatch
;=============================================================================

# This test should:
# A. In resRoot/PatchWithInputChunk/.., Exclude ![ Movie ]  ==> Should exclude *Movie* files in the two sub folders
# B. In resPrevious/*, Include [ Movie ]  ==> Should include *Movie* files in the previous folder only
# C. In resPatch/NextBuildResources/introMoviePrefixed.txt,  ==> Should include only this file
# D. In resRoot/PatchWithInputChunk/PreviousBuildResources/*, Exclude ![ testResource.txt ]  ==> Should exclude testResource.txt only


[resPatch_EllipseIncludeBothYamlAndTxtFiles]
filter      =   [ .yaml .txt ]
respaths    =   resPatch:/...
                resRoot:/PatchWithInputChunk/... ![ Movie ]
                resPrevious:/* [ Movie ]
                resLocalCDN:/../NextBuildResources/introMoviePrefixed.txt
                resRoot:/PatchWithInputChunk/PreviousBuildResources/* ![ testResource.txt ]



