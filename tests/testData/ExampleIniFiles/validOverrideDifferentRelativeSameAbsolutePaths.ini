[DEFAULT]
prefixmap = resRoot:. resOnBranch:resourcesOnBranch

#=============================================================================
# validOverrideDifferentRelativeSameAbsolutePaths.ini - test file
# This test should:
# A. Have two entries in the prefixmap:
#    * resRoot
#    * resOnBranch
# B. The respaths attribute should resolve to the same actual location
#    for both resRoot and resOnBranch (using the same type of wildcard, "*" in this case).

# Resolution of respaths:
#  - resRoot:/resourcesOnBranch/*  ==>  ./resourcesOnBranch/*   with filter [ .yaml ] ![ .txt ] + ![ .yaml ]  ==>  0 include & 2 exclude
#  - resOnBranch:/*                ==>  resourcesOnBranch/*     with filter [ .yaml ] ![ .txt ] + [ .txt ]    ==>  2 include & 0 exclude
# Those are two different relative paths, that will resolve to the same actual path.
# Because one relative path includes both extensions and the other excludes both,
# all files will be EXCLUDED.
# This is because files at the same hierarchy priority (in this case, priority=0
# because of wildcard search in the same directory), priority rules dictate that
# the files should be excluded.
#=============================================================================

[testOverrideOfTwoRespathsUsingDifferentPrefixesThatResolveToDifferentRelativeButSameActualPaths]
filter      =   [ .yaml ] ![ .txt ]
respaths    =   resRoot:/resourcesOnBranch/* ![ .yaml ]
                resOnBranch:/* [ .txt ]

