[DEFAULT]
prefixmap = resOnBranch:resourcesOnBranch

#=============================================================================
# validInlineFilterOverrideOnSameRelativePath.ini - test file
# This test should:
# A. Have one prefixmap entry:
#    * resOnBranch
# B. The respaths attribute should resolve as follows:
#  - resOnBranch:/*  ==>  resourcesOnBranch/*   with filter [ .yaml ] ![ .txt ] (parent) + ![ .yaml ] (inline #1)     ==>  0 include & 2 exclude
#  - resOnBranch:/*  ==>  resourcesOnBranch/*   with filter [ .yaml ] ![ .txt ] + ![ .yaml ] (already combined filter, see line above)
#                                                         + [ .yaml ] ![ .txt ] (parent again) + [ .txt ] (inline #2) ==>  2 include & 0 exclude
# Because the first instance of the relative path has zero includes and excludes both extensions,
# and the second instance includes the .txt ON TOP of the first instance ALONG WITH the parent filter again.
# Then we should end up with a filter that will:
# - include both .txt and .yaml files
# - exclude nothing
#=============================================================================

[testInlineFilterOverrideOnSameRelativePath]
filter      =   [ .yaml ] ![ .txt ]
respaths    =   resOnBranch:/* ![ .yaml ]
                resOnBranch:/* [ .txt ]

